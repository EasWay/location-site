<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Location client</title>
</head>
<body>
  <h2>Location client</h2>
  <p id="status">Disconnected</p>
  <button id="enable-btn">Enable Location</button>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    const SERVER = 'https://track-silent-pond-1528.fly.dev'; // no trailing slash
    const deviceId = 'phone-b';
    const statusEl = document.getElementById('status');
    const enableBtn = document.getElementById('enable-btn');

    let socket;
    let locationEnabled = false;

    enableBtn.onclick = () => {
      if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
      }

      // Ask permission explicitly via user gesture
      navigator.geolocation.getCurrentPosition(
        pos => {
          alert("Location permission granted");
          locationEnabled = true;
          initSocket();
        },
        err => {
          alert("Location permission denied: " + err.message);
        }
      );
    };

    function initSocket() {
      if (socket) return;

      socket = io(SERVER, { transports: ['websocket'] });

      socket.on('connect', () => {
        statusEl.textContent = 'Connected';
        socket.emit('register', { device: deviceId });
      });

      socket.on('disconnect', () => {
        statusEl.textContent = 'Disconnected';
      });

      socket.on('get_location', () => {
        if (!locationEnabled) {
          statusEl.textContent = 'Location not enabled by user';
          return;
        }

        statusEl.textContent = 'Request received. Asking for location';

        navigator.geolocation.getCurrentPosition(
          pos => {
            const c = pos.coords;
            const payload = {
              device: deviceId,
              coords: {
                latitude: c.latitude,
                longitude: c.longitude,
                accuracy: c.accuracy,
                altitude: c.altitude,
                heading: c.heading,
                speed: c.speed
              },
              timestamp: pos.timestamp,
              maps: `https://www.google.com/maps/search/?api=1&query=${c.latitude},${c.longitude}`
            };
            socket.emit('location', payload);
            statusEl.textContent = 'Location sent';
          },
          err => {
            socket.emit('location', { device: deviceId, error: err.message });
            statusEl.textContent = 'Permission denied or error';
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
        );
      });
    }
  </script>
</body>
</html>
