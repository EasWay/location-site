<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Location Client</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <h3>Location client running...</h3>

  <script>
    // Change this to your server URL
    const SERVER = "https://track-silent-pond-1528.fly.dev";

    const socket = io(SERVER, { transports: ["websocket"] });

    socket.on("connect", () => {
      console.log("Connected to server");
    });

    // Listen for location requests from server
    socket.on("get_location", (msg) => {
      console.log("Server requested location", msg);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy
            };

            const payload = {
              device: "phone-client",
              coords: coords
            };

            console.log("Sending location", payload);
            socket.emit("location", payload);
          },
          (err) => {
            console.error("Geolocation error", err);
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        console.error("Geolocation not supported in this browser");
      }
    });
  </script>
</body>
</html>
